<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 VIRAL VIDEO HUB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .points-box {
      margin: 15px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .points {
      font-size: 30px;
      font-weight: bold;
      color: #ff4b00;
    }

    .categories {
      display: flex;
      gap: 8px;
      padding: 10px;
      overflow-x: auto;
    }

    .categories button {
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      background: #ddd;
      cursor: pointer;
    }

    .categories button.active {
      background: #111;
      color: white;
    }

    #videos {
      padding: 10px;
    }

    .video-card {
      background: white;
      margin-bottom: 15px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .video-card video {
      width: 100%;
      display: block;
    }

    .video-info {
      padding: 12px;
    }

    .video-title {
      font-size: 18px;
      font-weight: bold;
    }

    .unlock-btn {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #ff4b00;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .free {
      color: green;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 20px;
    }
 
<body>
<div id="authBox" style="padding:20px; text-align:center;">
  <h3>🔐 Login / Sign Up</h3>

  <input id="email" type="email" placeholder="Email"
    style="padding:10px; width:90%; margin:5px;">

  <input id="password" type="password" placeholder="Password"
    style="padding:10px; width:90%; margin:5px;">

  <button onclick="signUp()" style="padding:10px; margin:5px;">
    Sign Up
  </button>

  <button onclick="login()" style="padding:10px; margin:5px;">
    Login
  </button>

  <p id="authMessage"></p>
</div>
<header>
  🔥 VIRAL VIDEO HUB
</header>

<div class="points-box">
  <div>💰 My Points</div>
  <div class="points" id="points">0</div>
</div>
<div class="points-box">
  <div>👥 Referral System</div>
  <div>Referral Code: <b id="referralCode">Loading...</b></div>
  <div style="margin-top:8px;">
    Referral Link:
    <input id="referralLink" readonly style="width:90%;padding:8px;">
  </div>
</div>
<div class="categories">
  <button class="active" onclick="loadVideos('All', this)">All</button>
  <button onclick="loadVideos('Trending', this)">Trending</button>
  <button onclick="loadVideos('Funny', this)">Funny</button>
  <button onclick="loadVideos('Music', this)">Music</button>
  <button onclick="loadVideos('Shorts', this)">Shorts</button>
</div>

<div id="videos"><div class="points-box">
  <div>👥 Referral System</div>
  <div>Referral Code: <b id="referralCode">Loading...</b></div>
  <div style="margin-top:8px;">
    Referral Link:
    <input id="referralLink" readonly style="width:90%;padding:8px;">
  </div>
</div>
  <div class="message">Loading videos...</div>
</div>

<script>
  const SUPABASE_URL = "https://pjpblyjejypzwwpxxgpf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_g1ziyyzBg57Z7WFowQnRQw_TRno8Xgn";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  async function loadReferral() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) return;

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("referral_code")
      .eq("id", user.id)
      .single();

    if (error || !data) return;

    document.getElementById("referralCode").innerText =
      data.referral_code || "Not available";

    document.getElementById("referralLink").value =
      "https://t.me/viral_video_linkk_bot/app?startapp=ref_" +
      data.referral_code;
  }
  async function loadPoints() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      document.getElementById("points").innerText = "0";
      return;
    }

    const { data, error } = await supabaseClient
      .from("profiles")
      .select("points")
      .eq("id", user.id)
      .single();

    if (!error && data) {
      document.getElementById("points").innerText = data.points;
    }
  }

  async function loadVideos(category = "All", button = null) {

    if (button) {
      document.querySelectorAll(".categories button")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");
    }

    const videosDiv = document.getElementById("videos");

    videosDiv.innerHTML =
      '<div class="message">Loading videos...</div>';

    let query = supabaseClient
      .from("videos")
      .select("*")
      .order("created_at", { ascending: false });

    if (category === "Trending") {
      query = query.eq("is_trending", true);
    } else if (category !== "All") {
      query = query.eq("category", category);
    }

    const { data, error } = await query;

    if (error) {
      videosDiv.innerHTML =
        '<div class="message">❌ Failed to load videos.</div>';
      return;
    }

    if (!data || data.length === 0) {
      videosDiv.innerHTML =
        '<div class="message">No videos found.</div>';
      return;
    }

    videosDiv.innerHTML = "";

    data.forEach(video => {

      const card = document.createElement("div");
      card.className = "video-card";

      const unlockPoints =
        Number(video.unlock_points || 0);

      let buttonHTML = "";

      if (unlockPoints > 0) {
        buttonHTML = `
          <button class="unlock-btn"
            onclick="unlockVideo(${video.id}, ${unlockPoints})">
            🔓 Unlock — ${unlockPoints} Points
          </button>
        `;
      } else {
        buttonHTML =
          '<div class="free">🆓 Free Video</div>';
      }

      card.innerHTML = `
        <video controls preload="metadata"
          src="${video.video_url}">
        </video>

        <div class="video-info">
          <div class="video-title">
            ${escapeHtml(video.title || "Untitled")}
          </div>

          <div>
            Category: ${escapeHtml(video.category || "Other")}
          </div>

          ${buttonHTML}
        </div>
      `;

      videosDiv.appendChild(card);
    });
  }

  async function unlockVideo(videoId, cost) {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      alert("Please login first.");
      return;
    }

    const confirmUnlock =
      confirm(
        `Unlock this video for ${cost} points?`
      );

    if (!confirmUnlock) return;

    const { data, error } =
      await supabaseClient.rpc(
        "unlock_video",
        {
          p_video_id: videoId
        }
      );

    if (error) {
      alert(error.message);
      return;
    }loadPoints();

    if (data && data.success) {
      alert("✅ Video unlocked!");

      await loadPoints();
      await loadVideos();
    }
  }
    function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
    async function signUp() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  document.getElementById("authMessage").innerText =
    error ? error.message : "✅ Sign Up successful!";
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  document.getElementById("authMessage").innerText =
    error ? error.message : "✅ Login successful!";
}

  loadReferral();
  loadPoints();
  loadVideos();
</script> 

</body>
</html>

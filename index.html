<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIRAL VIDEO HUB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #171717;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
      max-width: 800px;
      margin: auto;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .category {
      background: #252525;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #ff1744;
    }

    h2 {
      margin-top: 20px;
    }

    .video-card {
      background: #191919;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .video-card img {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #222;
    }

    .video-info {
      padding: 14px;
    }

    .video-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .video-category {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 11px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      background: #ff1744;
    }

    .download {
      background: #333;
    }

    .empty {
      text-align: center;
      color: #aaa;
      padding: 40px 10px;
    }
  </style>
</head>

<body>

<header>🔥 VIRAL VIDEO HUB</header>

<div class="container">

  <div class="categories">
    <button class="category active" onclick="loadVideos('All')">All</button>
    <button class="category" onclick="loadVideos('Trending')">Trending</button>
    <button class="category" onclick="loadVideos('Funny')">Funny</button>
    <button class="category" onclick="loadVideos('Music')">Music</button>
    <button class="category" onclick="loadVideos('Shorts')">Shorts</button>
  </div>

  <h2>Trending Videos</h2>

  <div id="videoList">
    <div class="empty">Loading videos...</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://pjpblyjejypzwwpxxgpf.supabase.co";

  // এখানে আপনার Supabase Publishable key বসাবেন
  const SUPABASE_KEY = "sb_publishable_g1ziyyzBg57Z7WFowQnRQw_TRno8Xgn";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadVideos(category = "All") {
    const videoList = document.getElementById("videoList");

    videoList.innerHTML = '<div class="empty">Loading videos...</div>';

    let query = supabaseClient
      .from("videos")
      .select("*")
      .order("created_at", { ascending: false });

    if (category === "Trending") {
      query = query.eq("is_trending", true);
    } else if (category !== "All") {
      query = query.eq("category", category);
    }

    const { data, error } = await query;

    if (error) {
      console.error(error);
      videoList.innerHTML =
        '<div class="empty">Could not load videos.</div>';
      return;
    }

    if (!data || data.length === 0) {
      videoList.innerHTML =
        '<div class="empty">No videos found.</div>';
      return;
    }

    videoList.innerHTML = data.map(video => `
      <div class="video-card">

        <img
          src="${video.thumbnail_url || 'https://via.placeholder.com/800x450?text=Viral+Video'}"
          alt="${escapeHtml(video.title || 'Video')}"
        >

        <div class="video-info">

          <div class="video-title">
            ${escapeHtml(video.title || "Untitled Video")}
          </div>

          <div class="video-category">
            ${escapeHtml(video.category || "General")}
          </div>

          <div class="buttons">
            <a
              class="btn"
              href="${video.video_url}"
              target="_blank"
            >
              ▶ Watch
            </a>

            <a
              class="btn download"
              href="${video.video_url}"
              download
            >
              ⬇ Download
            </a>
          </div>

        </div>
      </div>
    `).join("");
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  loadVideos();
</script>

</body>
</html>
